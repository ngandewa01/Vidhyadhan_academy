name: Android app

# Builds the app, runs its tests and publishes the signed APK on a GitHub Release.
on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

# a newer push cancels the build still running for the same branch
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          # keep compiled code between builds on this branch too (by default only main saves it)
          cache-read-only: false

      # tests and the signed APK in one Gradle run, so the app is compiled once and Gradle starts once
      - name: Tests and signed release APK
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -z "$SIGNING_KEYSTORE_B64" ]; then echo "::error::SIGNING_KEYSTORE_B64 secret is missing"; exit 1; fi
          echo "$SIGNING_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          export SIGNING_KEYSTORE="$RUNNER_TEMP/release.p12"
          # shrinking (R8) is the slowest part: only for main
          SHRINK=false; [ "$GITHUB_REF_NAME" = "main" ] && SHRINK=true
          ./gradlew --no-daemon --build-cache testDebugUnitTest assembleRelease -Pshrink=$SHRINK
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/Vidhyadhan-$VERSION.apk"

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: android/app/build/reports/tests

      - name: Upload screenshots and database schemas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            android/app/build/shots
            android/app/schemas

      - name: Keep the APK with this build
        uses: actions/upload-artifact@v4
        with:
          name: Vidhyadhan-${{ env.VERSION }}-apk
          path: ${{ runner.temp }}/Vidhyadhan-${{ env.VERSION }}.apk
          retention-days: 90

      - name: Publish on a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="app-v$VERSION"
          APK="$RUNNER_TEMP/Vidhyadhan-$VERSION.apk"
          PRE=""
          [ "$GITHUB_REF_NAME" != "main" ] && PRE="--prerelease"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --target "$GITHUB_SHA" --title "Android app $VERSION" $PRE \
              --notes "Built from \`$GITHUB_REF_NAME\` ($GITHUB_SHA). Open this page on the phone and tap the .apk file to download."
          fi
          # A fixed link that always has the newest build: .../releases/download/app-latest/Vidhyadhan.apk
          cp "$APK" "$RUNNER_TEMP/Vidhyadhan.apk"
          if gh release view app-latest >/dev/null 2>&1; then
            gh release upload app-latest "$RUNNER_TEMP/Vidhyadhan.apk" --clobber
          else
            gh release create app-latest "$RUNNER_TEMP/Vidhyadhan.apk" --target "$GITHUB_SHA" --title "Android app (latest build)" --prerelease \
              --notes "Always the newest build. Download Vidhyadhan.apk below."
          fi

